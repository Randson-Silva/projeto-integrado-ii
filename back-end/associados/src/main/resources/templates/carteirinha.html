<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: A4; margin: 15mm; }
        body { font-family: 'Helvetica', Arial, sans-serif; margin: 0; padding: 0; color: #1A202C; }
        .print-instructions { font-size: 12px; color: #718096; margin-bottom: 10mm; border-bottom: 1px solid #E2E8F0; padding-bottom: 5px; }
        
        .card { 
            width: 85.6mm; height: 53.98mm; position: relative; overflow: hidden; display: block; 
            background-color: #EFE9D9; border: none; margin-bottom: 10mm; box-sizing: border-box;
            border-radius: 3mm;
        }

        .sidebar-front { position: absolute; right: 0; top: 0; width: 10mm; height: 100%; border-radius: 0 3mm 3mm 0; overflow: hidden; }
        .sidebar-back { position: absolute; left: 0; top: 0; width: 10mm; height: 100%; border-radius: 3mm 0 0 3mm; overflow: hidden; }
        .sidebar-img { width: 100%; height: 100%; }

        /* FRENTE */
        .content-front { padding: 3mm 13mm 3mm 3mm; position: relative; z-index: 2; }

        /* Cabeçalho: logo à esquerda, texto à direita */
        .header { display: table; width: 100%; margin-bottom: 1.5mm; }
        .header-logo { display: table-cell; width: 16mm; vertical-align: middle; }
        .logo-top { width: 14mm; display: block; }
        .header-info { display: table-cell; vertical-align: middle; padding-left: 1.5mm; }
        .group-name { font-size: 2.4mm; font-weight: bold; text-transform: uppercase; color: #000; display: block; line-height: 1.3; }
        .cnpj { font-size: 1.8mm; font-weight: bold; color: #444; display: block; margin-top: 0.3mm; }

        .title { text-align: center; font-size: 3.5mm; font-weight: bold; margin: 1mm 0; }
        
        .details { display: table; width: 100%; margin-top: 1mm; }
        .photo-box { display: table-cell; width: 18mm; height: 23mm; background-color: #CCC; border-radius: 1mm; vertical-align: middle; text-align: center; }
        .photo-box img { width: 100%; height: 100%; border-radius: 1mm; object-fit: cover; }
        
        .fields { display: table-cell; padding-left: 2mm; vertical-align: top; }
        .row { display: table; width: 100%; margin-bottom: 0.8mm; }
        .field { background-color: #FFF; border: 0.1mm solid #CBD5E0; border-radius: 1mm; padding: 0.8mm; display: table-cell; }
        .label { font-size: 1.2mm; color: #718096; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 0.2mm; }
        .value { font-size: 2mm; font-weight: bold; color: #000; display: block; text-transform: uppercase; }

        /* VERSO */
        .content-back { padding: 3mm 3mm 12mm 13mm; text-align: center; position: relative; z-index: 2; }
        .logo-back { width: 45mm; display: block; margin: 5mm auto 0; }
        .verify { font-size: 2mm; color: #718096; position: absolute; bottom: 3mm; left: 13mm; right: 3mm; text-align: center; }
    </style>
</head>
<body>

<!-- FRENTE -->
    <div class="card">
        <div class="content-front">
            <div class="header">
                <div class="header-logo">
                    <img th:src="${logoBase64}" class="logo-top" />
                </div>
                <div class="header-info">
                    <span class="group-name">Grupo Cultural de Dom Maurício</span>
                    <span class="cnpj">CNPJ: 01.122.327/0001-07</span>
                </div>
            </div>

            <div class="title">Carteira do Associado</div>

            <div class="details">
                <div class="photo-box">
                    <img th:if="${fotoBase64}" th:src="${fotoBase64}" />
                </div>
                <div class="fields">
                    <div class="row"><div class="field"><span class="label">Nome Completo</span><span class="value" th:text="${card.fullName}"></span></div></div>
                    <div class="row"><div class="field"><span class="label">Nome Social</span><span class="value" th:text="${card.socialName}"></span></div></div>
                    <div class="row">
                        <div class="field" style="width: 50%"><span class="label">CPF</span><span class="value" th:text="${card.cpf}"></span></div>
                        <div class="field" style="width: 50%"><span class="label">Validade</span><span class="value" th:text="${#temporals.format(card.validity, 'dd/MM/yyyy')}"></span></div>
                    </div>
                    <div class="row">
                        <div class="field" style="width: 40%"><span class="label">Nº</span><span class="value" th:text="${card.number}"></span></div>
                        <div class="field" style="width: 60%"><span class="label">Categoria</span><span class="value" th:text="${card.category != null ? card.category.name : 'N/A'}"></span></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="sidebar-front"><img th:src="${sidebarBase64}" class="sidebar-img" /></div>
    </div>

    <!-- VERSO -->
    <div class="card">
        <div class="sidebar-back"><img th:src="${sidebarBase64}" class="sidebar-img" /></div>
        <div class="content-back">
            <img th:src="${logoBase64}" class="logo-back" />
            <div class="verify">
                Verifique a autenticidade do documento em:<br>
                <strong>www.sigacultural.com</strong>
            </div>
        </div>
    </div>

</body>
</html>
